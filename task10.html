    <main>
        <h1>Task 10: Combined Animation</h1>
        <p>Combine opacity, size and movement in one animation.</p>

        <div class="card">
            <h3>Combined Animation Box</h3>

            <div id="box"></div>

            <button id="startButton">Start Animation</button>
            <button id="resetButton">Reset</button>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function() {

            $("#startButton").click(function() {
                $("#box").animate({
                    width: "200px",
                    height: "200px",
                    left: "150px",
                    opacity: 0.3
                }, 2000);
            });

            $("#resetButton").click(function() {
                $("#box").stop(true, true).css({
                    width: "100px",
                    height: "100px",
                    left: "0px",
                    opacity: 1
                });
            });

        });
    </script>

</body>
