    <main>
        <h1>Task 4: Slide Methods</h1>
        <p>Practice slideUp, slideDown and slideToggle methods.</p>

        <div class="card">
            <h3>Collapsible Panel</h3>

            <div id="slidePanel" style="background: #dce7ff; padding: 30px; border-radius: 10px;">
                <h3>Hello!</h3>
                <p>This is a collapsible panel.</p>
                <p>You can open and close it using jQuery.</p>
            </div>

            <button id="slideUpButton">Slide Up</button>
            <button id="slideDownButton">Slide Down</button>
            <button id="slideToggleButton">Slide Toggle</button>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {

            $("#slideUpButton").click(function () {
                $("#slidePanel").slideUp(1000);
            });

            $("#slideDownButton").click(function () {
                $("#slidePanel").slideDown(1000);
            });

            $("#slideToggleButton").click(function () {
                $("#slidePanel").slideToggle(1000);
            });

        });
    </script>
