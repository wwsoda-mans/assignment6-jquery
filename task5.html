    <main>
        <h1>Task 5: Add & Remove Elements</h1>
        <p>Practice adding and removing elements using jQuery.</p>

        <div class="card">
            <h3>My Shopping List</h3>

            <ul id="myList">
                <li>Milk</li>
                <li>Bread</li>
                <li>Eggs</li>
            </ul>

            <button id="addButton">Add Item</button>
            <button id="prependButton">Prepend Item</button>
            <button id="removeButton">Remove Last Item</button>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {

            $("#addButton").click(function () {
                $("#myList").append("<li>New Item</li>");
            });

            $("#prependButton").click(function () {
                $("#myList").prepend("<li>First Item</li>");
            });

            $("#removeButton").click(function () {
                $("#myList li:last").remove();
            });

        });
    </script>
