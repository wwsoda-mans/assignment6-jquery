    <main>
        <h1>Task 3: Fade Methods</h1>
        <p>Practice fadeIn, fadeOut and fadeToggle methods.</p>

        <div class="card">
            <h3>Image Effects</h3>

            <img id="fadeImage" src="https://picsum.photos/id/1018/600/350" alt="Beautiful mountain landscape"
                style="width: 100%; max-width: 500px; border-radius: 10px; display: none;">

            <br>

            <button id="fadeInButton">Fade In</button>
            <button id="fadeOutButton">Fade Out</button>
            <button id="fadeToggleButton">Fade Toggle</button>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {

            $("#fadeInButton").click(function () {
                $("#fadeImage").fadeIn(1000);
            });

            $("#fadeOutButton").click(function () {
                $("#fadeImage").fadeOut(1000);
            });

            $("#fadeToggleButton").click(function () {
                $("#fadeImage").fadeToggle(1000);
            });

        });
    </script>
