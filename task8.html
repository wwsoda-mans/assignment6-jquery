    <main>
        <h1>Task 8: Basic Animation</h1>
        <p>Use jQuery animate() to change the size and position of a square.</p>

        <div class="card">
            <h3>Animation Box</h3>

            <div id="box"></div>

            <button id="animateButton">Start Animation</button>
            <button id="resetButton">Reset</button>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {

            $("#animateButton").click(function () {
                $("#box").animate({
                    width: "200px",
                    height: "200px",
                    left: "150px"
                }, 1000);
            });

            $("#resetButton").click(function () {
                $("#box").animate({
                    width: "100px",
                    height: "100px",
                    left: "0px"
                }, 1000);
            });

        });
    </script>

</body>
