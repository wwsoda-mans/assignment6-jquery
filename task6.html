    <main>
        <h1>Task 6: Modifying Attributes</h1>
        <p>Practice changing image and link attributes using jQuery.</p>

        <div class="card">
            <h3>Change Image</h3>

            <img id="myImage" src="https://picsum.photos/id/1018/500/300" alt="Mountain landscape"
                style="width: 100%; max-width: 500px; border-radius: 10px;">

            <br>

            <button id="imageButton">Change Image</button>
        </div>

        <div class="card">
            <h3>Change Link</h3>

            <p>
                <a id="myLink" href="https://www.google.com" target="_blank">
                    Visit Google
                </a>
            </p>

            <button id="linkButton">Change Link</button>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {

            $("#imageButton").click(function () {
                $("#myImage").attr("src", "https://picsum.photos/id/1015/500/300");
            });

            $("#linkButton").click(function () {
                $("#myLink").attr("href", "https://www.instagram.com/wwsoda_?srtk=MTR4dTc3enQ2NzdpaA%3D%3D&utm_source=qr");
                $("#myLink").text("Visit My Instagram");
            });

        });
    </script>
